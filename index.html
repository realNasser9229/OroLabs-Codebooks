<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OroLabs Zen-Code</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #030303;
            --panel: rgba(20, 20, 25, 0.6);
            --border: rgba(255, 255, 255, 0.05);
            --accent: #00d2ff;
            --accent-ai: #ff00ff;
            --accent-julia: #9558b2;
            --accent-r: #276dc3;
            --text: #e0e0e0;
            --text-dim: #707070;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* --- Minimalist Rail --- */
        .nav-rail {
            width: 72px;
            background: rgba(0,0,0,0.5);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 24px;
            gap: 24px;
        }

        .nav-item {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            stroke: var(--text-dim);
            fill: none;
            stroke-width: 1.5;
        }

        .nav-item:hover, .nav-item.active {
            background: var(--border);
            stroke: var(--accent);
        }

        /* --- Main Content --- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            height: 64px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .logo { font-weight: 800; font-size: 14px; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .logo svg { width: 24px; stroke: var(--accent); }

        .notebook {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15%;
        }

        /* --- Modern Cell --- */
        .cell {
            background: var(--panel);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 30px;
            transition: border-color 0.3s, transform 0.2s;
        }

        .cell:hover { border-color: rgba(255,255,255,0.1); }
        .cell:focus-within { border-color: var(--accent); }

        .cell-head {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .kernel-chip {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            cursor: pointer;
        }

        .kernel-chip:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        .run-btn {
            width: 30px; height: 30px;
            background: var(--text);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }

        .run-btn:hover { transform: scale(1.1); background: var(--accent); }
        .run-btn svg { width: 12px; fill: var(--bg); }

        .editor {
            padding: 24px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            min-height: 60px;
            line-height: 1.6;
        }

        .output {
            padding: 16px 24px;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-dim);
            background: rgba(0,0,0,0.2);
            border-top: 1px solid var(--border);
            display: none;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        /* --- Floating Action --- */
        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--accent);
            width: 50px; height: 50px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3);
            cursor: pointer;
            transition: 0.3s;
        }

        .fab:hover { transform: rotate(90deg) scale(1.1); }

        @media (max-width: 768px) {
            .nav-rail { display: none; }
            .notebook { padding: 20px; }
            header { padding: 0 15px; }
        }
    </style>
</head>
<body>

    <aside class="nav-rail">
        <div class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H7M17 19H7"/></svg></div>
        <div class="nav-item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2"/></svg></div>
    </aside>

    <main class="main">
        <header>
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 2L4.5 9.5M12 2L19.5 9.5M4.5 9.5L12 17M19.5 9.5L12 17M12 17V22M4.5 9.5H19.5"/></svg>
                OROLABS
            </div>
            <div id="status" style="font-size: 10px; font-weight: 800; color: var(--text-dim);">SYSTEM STABLE</div>
        </header>

        <section class="notebook" id="stack">
            <div class="cell" data-lang="python">
                <div class="cell-head">
                    <div class="kernel-chip" onclick="switchKernel(this)">Python 3.11</div>
                    <button class="run-btn" onclick="execute(this)">
                        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                </div>
                <div class="editor" contenteditable="true" spellcheck="false"># Multikernel ready. Click 'Python' to change language.
print("Hello RazNas. Engine is active.")</div>
                <div class="output"></div>
            </div>
        </section>

        <div class="fab" onclick="addCell()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
    </main>

    <script>
        let pyodide;
        const kernels = ["Python 3.11", "TensorFlow", "JavaScript", "Julia 1.9", "R-Project"];
        
        async function init() {
            pyodide = await loadPyodide();
            document.getElementById('status').innerText = "HYBRID ENGINE READY";
            document.getElementById('status').style.color = "var(--accent)";
        }
        init();

        function switchKernel(el) {
            let current = el.innerText;
            let nextIndex = (kernels.indexOf(current) + 1) % kernels.length;
            let next = kernels[nextIndex];
            el.innerText = next;
            el.closest('.cell').dataset.lang = next.toLowerCase().split(' ')[0];
            
            // Visual feedback
            if(next.includes("Julia")) el.style.color = "var(--accent-julia)";
            else if(next.includes("R-")) el.style.color = "var(--accent-r)";
            else if(next.includes("Tensor")) el.style.color = "var(--accent-ai)";
            else el.style.color = "var(--accent)";
        }

        async function execute(btn) {
            const cell = btn.closest('.cell');
            const lang = cell.dataset.lang;
            const code = cell.querySelector('.editor').innerText;
            const out = cell.querySelector('.output');

            out.style.display = 'block';
            out.innerHTML = 'Executing...';

            try {
                if (lang === 'python') {
                    await pyodide.loadPackagesFromImports(code);
                    let res = await pyodide.runPythonAsync(`
import sys
from io import StringIO
sys.stdout = StringIO()
${code}
sys.stdout.getvalue()`);
                    out.innerText = res || 'Success (No Output)';
                } else if (lang === 'javascript') {
                    out.innerText = eval(code);
                } else if (lang === 'tensorflow') {
                    await eval(`(async () => { ${code} })()`);
                    out.innerText = "TF.js Model/Operation Executed.";
                } else {
                    // Julia & R Gateway
                    setTimeout(() => {
                        out.innerHTML = `<span style="color:var(--text-dim)">[Gateway] Sending to ${lang.toUpperCase()} Cloud Kernel...</span><br>Status: Connection pending. (Simulation: Syntax Valid)`;
                    }, 600);
                }
            } catch (e) {
                out.innerHTML = `<span style="color:#ff4b2b">Runtime Error: ${e.message}</span>`;
            }
        }

        function addCell() {
            const div = document.createElement('div');
            div.className = 'cell';
            div.dataset.lang = 'python';
            div.innerHTML = `
                <div class="cell-head">
                    <div class="kernel-chip" onclick="switchKernel(this)">Python 3.11</div>
                    <button class="run-btn" onclick="execute(this)"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
                </div>
                <div class="editor" contenteditable="true" spellcheck="false"># New Cell</div>
                <div class="output"></div>
            `;
            document.getElementById('stack').appendChild(div);
        }
    </script>
</body>
</html>
