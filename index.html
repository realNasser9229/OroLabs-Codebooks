<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OroLabs Codebooks</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-base: #05070a;
            --glass-surface: rgba(17, 25, 39, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(0, 210, 255, 0.5);
            --accent-solid: #00d2ff;
            --accent-run: #2ea043;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --code-blue: #7dd3fc;
            --code-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scrollbar-width: thin;
            scrollbar-color: var(--glass-border) transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.07) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(110, 64, 201, 0.07) 0px, transparent 50%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .app-header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--glass-surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .gemini-outline-logo {
            width: 32px;
            height: 32px;
            stroke: var(--accent-solid);
            stroke-width: 1.5;
            fill: none;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        .project-meta h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .project-meta span {
            font-size: 11px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- Main Layout --- */
        .app-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 72px;
            background: var(--glass-surface);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            gap: 32px;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: none;
            stroke: var(--text-secondary);
            stroke-width: 2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon:hover, .nav-icon.active {
            stroke: var(--accent-solid);
            filter: drop-shadow(0 0 5px var(--accent-glow));
            transform: translateY(-2px);
        }

        /* --- Notebook Content --- */
        .notebook-view {
            flex: 1;
            overflow-y: auto;
            padding: 32px;
            background: transparent;
        }

        .notebook-width-limiter {
            max-width: 1000px;
            margin: 0 auto;
        }

        .action-bar {
            margin-bottom: 32px;
            display: flex;
            gap: 12px;
        }

        .btn-action {
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent-solid);
            stroke-width: 2;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-solid);
        }

        /* --- Cell UI --- */
        .cell {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
        }

        .cell:focus-within {
            border-color: rgba(0, 210, 255, 0.3);
            background: rgba(255, 255, 255, 0.025);
        }

        .cell-controls {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--glass-border);
        }

        .run-trigger {
            width: 32px;
            height: 32px;
            background: var(--accent-run);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }

        .run-trigger svg {
            width: 14px;
            height: 14px;
            fill: white;
        }

        .editor-pane {
            padding: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: var(--code-blue);
            outline: none;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .output-pane {
            padding: 16px 20px;
            background: #000;
            border-top: 1px solid var(--glass-border);
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            color: var(--text-secondary);
            display: none;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 72px;
                flex-direction: row;
                justify-content: space-around;
                padding: 0;
                border-right: none;
                border-top: 1px solid var(--glass-border);
            }

            .notebook-view {
                padding: 20px 16px 100px 16px;
            }

            .btn-action span { display: none; }
            .btn-action { padding: 10px; }
        }
    </style>
</head>
