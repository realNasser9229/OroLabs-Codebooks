<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OroLabs Codebooks | AI Research</title>
    <style>
        :root {
            --bg-deep: #0a0c10;
            --glass-bg: rgba(22, 27, 34, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #00d2ff; /* Liquid Blue */
            --accent-secondary: #3a7bd5;
            --text-main: #e6edf3;
            --text-dim: #8b949e;
            --code-bg: #0d1117;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 50%, #161b22 0%, #0a0c10 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        .header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .filename-container {
            display: flex;
            flex-direction: column;
        }

        .filename {
            font-size: 14px;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            box-shadow: 0 0 8px #238636;
        }

        /* Layout Container */
        .app-body {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar: Vertical on PC, Horizontal on Mobile */
        .sidebar {
            width: 60px;
            background: var(--glass-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            gap: 25px;
            transition: all 0.3s ease;
        }

        .nav-item {
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, transform 0.2s;
            font-size: 20px;
        }

        .nav-item:hover, .nav-item.active {
            opacity: 1;
            transform: scale(1.1);
            color: var(--accent-primary);
        }

        /* Main Notebook */
        .notebook {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .notebook-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(5px);
            transition: border-color 0.2s;
        }

        .btn:hover {
            border-color: var(--accent-primary);
        }

        /* Cells with Liquid Glass effect */
        .cell {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .cell:focus-within {
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
            border-color: rgba(0, 210, 255, 0.4);
        }

        .cell-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        .play-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--accent-primary);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
        }

        .code-area {
            padding: 15px;
            font-family: 'Fira Code', 'Cascadia Code', monospace;
            font-size: 14px;
            outline: none;
            min-height: 60px;
            white-space: pre-wrap;
            color: #9cdcfe;
        }

        .output-area {
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.4);
            border-top: 1px solid var(--glass-border);
            font-family: monospace;
            font-size: 13px;
            color: var(--text-dim);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 60px;
                flex-direction: row;
                justify-content: space-around;
                padding-top: 0;
                border-right: none;
                border-top: 1px solid var(--glass-border);
            }

            .notebook {
                padding: 15px 10px 80px 10px;
            }

            .header-right {
                display: none; /* Simplify mobile header */
            }

            .hero-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            <div class="brand-logo"></div>
            <div class="filename-container">
                <span class="filename">orolabs_main.ipynb</span>
                <span style="font-size: 11px; color: var(--text-dim);">
                    <span class="status-dot"></span>Active Session
                </span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn" style="border-radius: 6px;">RAM 0.8GB / 12GB</button>
        </div>
    </header>

    <div class="app-body">
        <nav class="sidebar">
            <div class="nav-item active" title="Files">📁</div>
            <div class="nav-item" title="Search">🔍</div>
            <div class="nav-item" title="Settings">⚙️</div>
            <div class="nav-item" title="Variables">{}</div>
        </nav>

        <main class="notebook">
            <div class="notebook-inner">
                <div class="toolbar">
                    <button class="btn" onclick="addCell()">+ Code</button>
                    <button class="btn">+ Text</button>
                </div>

                <div id="cell-container">
                    <div class="cell">
                        <div class="cell-header">
                            <button class="play-btn">▶</button>
                            <span style="margin-left: 15px; font-size: 12px; color: var(--text-dim);">[1]</span>
                        </div>
                        <div class="code-area" contenteditable="true" spellcheck="false">import orolabs_ai as ai

# Initializing Nasoro Engine...
model = ai.load("nasoro-v3-ultra")
model.launch_webchat()</div>
                        <div class="output-area">
                            Successfully connected to Botpress cloud.
                            Ready for input at 2026-03-12 16:55 UTC.
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/03/12/15/20260312151313-UGOZEFTQ.js" defer></script>

    <script>
        function addCell() {
            const container = document.getElementById('cell-container');
            const newCell = document.createElement('div');
            newCell.className = 'cell';
            newCell.innerHTML = `
                <div class="cell-header">
                    <button class="play-btn">▶</button>
                    <span style="margin-left: 15px; font-size: 12px; color: var(--text-dim);">[*]</span>
                </div>
                <div class="code-area" contenteditable="true" spellcheck="false"># New Code Cell</div>
            `;
            container.appendChild(newCell);
            newCell.scrollIntoView({ behavior: 'smooth' });
        }

        // Handle Play Button Visuals
        document.addEventListener('click', (e) => {
            if (e.target.closest('.play-btn')) {
                const btn = e.target.closest('.play-btn');
                btn.style.transform = 'scale(0.9)';
                btn.style.filter = 'brightness(1.5)';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                    btn.style.filter = 'none';
                }, 200);
            }
        });
    </script>
</body>
</html>
